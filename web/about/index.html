<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>About — Onextap</title>
<meta name="description" content="Onextap is an application copilot for the person applying: a Chrome extension that fills job applications and drafts the written answers in your own words.">
<!-- Self-referencing canonical, trailing slash included: the same spelling
     the sitemap lists. -->
<link rel="canonical" href="https://www.onextap.com/about/">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<!--
  Structured data (JSON-LD): this page, and where it sits. The site's identity
  — Organization, WebSite, the extension itself — is declared once on the
  landing page, which is where Google reads it from.
-->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "AboutPage",
      "@id": "https://www.onextap.com/about/#webpage",
      "url": "https://www.onextap.com/about/",
      "name": "About — Onextap",
      "description": "Onextap is an application copilot for the person applying: a Chrome extension that fills job applications and drafts the written answers in your own words.",
      "inLanguage": "en",
      "isPartOf": { "@id": "https://www.onextap.com/#website" },
      "publisher": {
        "@type": "Organization",
        "name": "Onextap",
        "url": "https://www.onextap.com/"
      },
      "breadcrumb": { "@id": "https://www.onextap.com/about/#breadcrumb" }
    },
    {
      "@type": "BreadcrumbList",
      "@id": "https://www.onextap.com/about/#breadcrumb",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Onextap", "item": "https://www.onextap.com/" },
        { "@type": "ListItem", "position": 2, "name": "About" }
      ]
    }
  ]
}
</script>
</head>
<body>

<!-- A company page: the landing page's cursor, nav spine, menu and header
     row, over an ordinary scrolling page (src/pages/sub-page.js). Each
     [data-mount] placeholder is replaced by that feature's markup. -->
<div data-mount="cursor"></div>
<div data-mount="nav"></div>
<div data-mount="hud"></div>
<div class="sub-bar" data-header-row aria-hidden="true"></div>

<!-- What the open menu covers (and holds inert). -->
<div class="sub" data-page>
  <main id="top" data-chapter="Company — About">
    <div data-mount="about"></div>
  </main>
  <div data-mount="page-foot"></div>
</div>

<div data-mount="login"></div>

<script type="module" src="/src/pages/about/about.js"></script>
</body>
</html>
